name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repouser
          POSTGRES_PASSWORD: repopassword
          POSTGRES_DB: repodefense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repouser -d repodefense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then
            pip install ./backend
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Backend Lint Check (ruff)
        run: |
          if [ -d backend/app ]; then
            ruff check backend/app
          else
            echo "backend/app not initialized yet, skipping ruff"
          fi

      - name: Run Database Migrations (alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://repouser:repopassword@localhost:5432/repodefense
        run: |
          cd backend && alembic upgrade head

      - name: Backend Unit Tests (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://repouser:repopassword@localhost:5432/repodefense
          REDIS_URL: redis://localhost:6379/0
        run: |
          if [ -d backend/tests ]; then
            pytest backend/tests/ -v --cov=backend/app
          else
            echo "backend/tests not initialized yet, skipping pytest"
          fi

  frontend:
    name: Frontend Typecheck, Lint & Tests (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci || npm install
          else
            echo "frontend/package.json not initialized yet, skipping npm install"
          fi

      - name: Frontend TypeScript Check
        run: |
          if [ -f frontend/tsconfig.json ]; then
            cd frontend && npx tsc --noEmit
          else
            echo "frontend/tsconfig.json not initialized yet, skipping tsc"
          fi

      - name: Frontend ESLint Check
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run lint || true
          fi

      - name: Frontend Tests
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm test -- --passWithNoTests || true
          fi
