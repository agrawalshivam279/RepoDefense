name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repouser
          POSTGRES_PASSWORD: repopassword
          POSTGRES_DB: repodefense
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repouser -d repodefense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Backend Lint Check (ruff)
        run: |
          python -m ruff check backend/app backend/tests

      - name: Run Database Migrations (alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://repouser:repopassword@127.0.0.1:5433/repodefense
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Backend Unit Tests (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://repouser:repopassword@127.0.0.1:5433/repodefense
          REDIS_URL: redis://127.0.0.1:6379/0
          SUPABASE_JWT_SECRET: testing-supabase-jwt-secret-min-32-chars-long
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term

  frontend:
    name: Frontend Typecheck & Production Build (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Frontend TypeScript Check
        run: |
          cd frontend && npm run typecheck

      - name: Frontend Next.js Production Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          cd frontend && npm run build
