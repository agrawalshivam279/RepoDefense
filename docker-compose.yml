name: repodefense

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: repodefense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopassword}
      POSTGRES_DB: ${POSTGRES_DB:-repodefense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repouser} -d ${POSTGRES_DB:-repodefense}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repodefense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repodefense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-RepoDefense API}
      VERSION: ${VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repouser}:${POSTGRES_PASSWORD:-repopassword}@postgres:5432/${POSTGRES_DB:-repodefense}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
